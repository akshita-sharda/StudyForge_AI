services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyforge}
      POSTGRES_USER: ${POSTGRES_USER:-studyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://studyforge:change-me@db:5432/studyforge}
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MOCK_AI: ${MOCK_AI:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: [./backend/uploads:/app/uploads]
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1]
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { postgres_data: }
